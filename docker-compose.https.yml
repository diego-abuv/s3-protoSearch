services:
  caddy:
    image: caddy:2-alpine
    container_name: s3-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - s3-protosearch

  s3-protosearch:
    expose:
      - "80"

volumes:
  caddy_data:
  caddy_config:
