<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>Login — Buscador de Protocolos</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
    <span class="theme-icon-light">&#9788;</span>
    <span class="theme-icon-dark">&#9790;</span>
  </button>

  <main class="container d-flex flex-column min-vh-100 py-4 justify-content-center align-items-center">
    <div class="text-center mb-4">
      <h1 class="display-5 fw-bold gradient-text">Buscador de Protocolos</h1>
      <p class="text-secondary fs-6">Acesse sua conta</p>
    </div>

    <div class="col-sm-5">
      <div class="card glass-card border-0">
        <div class="card-body p-4">
          <form id="formLogin" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label small fw-medium">Usuário</label>
              <input type="text" class="form-control glass-input" id="username" required autofocus>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label small fw-medium">Senha</label>
              <input type="password" class="form-control glass-input" id="password" required>
            </div>
            <div id="loginError" class="login-error d-none small mb-3" role="alert"></div>
            <button type="submit" class="btn btn-gradient w-100" id="btnEntrar">
              <span id="btn-text">Entrar</span>
              <span id="btn-spinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <footer class="text-center mt-auto pt-4 pb-2">
      <span class="text-secondary small footer-credit">Desenvolvido por Diego Bueno</span>
    </footer>
  </main>

  <script src="/vendor/bootstrap.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
