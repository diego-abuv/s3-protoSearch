<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Protocolos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
  <main class="container" style="max-width: 720px;">
    <div class="text-center mb-4">
      <h1 class="h3 fw-semibold mb-1">Buscador de Protocolos</h1>
      <p class="text-secondary small">AWS S3 + servidores locais</p>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form id="formBusca" novalidate>
          <div class="row g-3">
            <div class="col-sm-5">
              <label for="data" class="form-label small fw-medium">Data do protocolo</label>
              <input type="date" class="form-control" id="data" required>
            </div>
            <div class="col-sm-7">
              <label for="nomeProtocolo" class="form-label small fw-medium">Nome do arquivo</label>
              <div class="input-group">
                <input type="text" class="form-control" id="nomeProtocolo" placeholder="Ex: 0385406313" required>
                <button type="submit" class="btn btn-primary px-4" id="btnBuscar">
                  <span id="btn-text">Buscar</span>
                  <span id="btn-spinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div id="resultado" class="mt-3"></div>
  </main>

  <script src="/main.js"></script>
</body>
</html>
