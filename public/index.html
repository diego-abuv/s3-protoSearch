<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>S3 ProtoSearch</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav class="navbar-glass">
    <div class="user-menu">
      <button class="user-menu-toggle" id="userMenuToggle">
        <span class="user-avatar" id="userAvatar"></span>
        <span class="user-chevron">&#9662;</span>
      </button>
      <div class="user-dropdown" id="userDropdown">
        <div class="user-dropdown-info" id="userInfo"></div>
        <div class="user-dropdown-divider"></div>
        <button class="user-dropdown-item d-none" id="btnAdmin" style="color: inherit;">Admin</button>
        <div class="user-dropdown-divider d-none" id="divAdminDivider"></div>
        <button class="user-dropdown-item" id="btnLogout">Sair</button>
      </div>
    </div>
  </nav>

  <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
    <span class="theme-icon-light">&#9788;</span>
    <span class="theme-icon-dark">&#9790;</span>
  </button>

  <main class="container d-flex flex-column min-vh-100 py-4">
    <div class="row justify-content-center flex-grow-1 align-items-center" style="overflow-y: auto;">
      <div class="col-lg-7 col-md-9">
        <div class="text-center mb-4">
          <h1 class="display-5 fw-bold gradient-text">S3 ProtoSearch</h1>
          <p class="text-secondary fs-6">Busca de arquivos em servidores locais e nuvem</p>
        </div>

        <div class="card glass-card border-0">
          <div class="card-body p-4">
            <form id="formBusca" novalidate>
              <div class="row g-3">
                <div class="col-sm-5">
                  <label for="data" class="form-label small fw-medium">Data do protocolo</label>
                  <input type="date" class="form-control glass-input" id="data" required>
                </div>
                <div class="col-sm-7">
                  <label for="nomeProtocolo" class="form-label small fw-medium">Nome do arquivo</label>
                  <div class="input-group">
                    <input type="text" class="form-control glass-input" id="nomeProtocolo" placeholder="Ex: 0385406313" required>
                    <button type="submit" class="btn btn-gradient px-4" id="btnBuscar">
                      <span id="btn-text">Buscar</span>
                      <span id="btn-spinner" class="spinner-border spinner-border-sm d-none"></span>
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div id="resultado" class="mt-3"></div>
      </div>
    </div>

    <footer class="text-center mt-auto pt-4 pb-2">
      <span class="text-secondary small footer-credit">Desenvolvido por Diego Bueno</span>
    </footer>
  </main>

  <template id="tmpl-progress">
    <div class="search-progress"><div class="progress-step active"><span class="step-indicator"></span><span>Consultando servidores...</span></div></div>
  </template>

  <template id="tmpl-result-card">
    <div class="result-card">
      <div class="d-flex align-items-start gap-3 mb-3">
        <div class="result-icon"></div>
        <div class="flex-grow-1 min-w-0">
          <strong class="fs-6"></strong>
          <div class="text-secondary small"></div>
        </div>
      </div>
      <div class="search-steps mb-3"></div>
      <div class="download-buttons"></div>
    </div>
  </template>

  <template id="tmpl-step">
    <div class="step-item">
      <div class="step-dot"></div>
      <div>
        <div class="step-fonte"></div>
        <div class="step-status"></div>
      </div>
    </div>
  </template>

  <template id="tmpl-download-btn">
    <a class="btn btn-success btn-sm" target="_blank" rel="noopener">&#10515; </a>
  </template>

  <template id="tmpl-error-card">
    <div class="result-card error">
      <div class="d-flex align-items-start gap-3">
        <div class="result-icon error-icon">!</div>
        <div class="flex-grow-1 min-w-0">
          <strong class="fs-6"></strong>
          <p class="mb-1 text-secondary small"></p>
          <pre class="mb-0 text-warning small" style="white-space:pre-wrap"></pre>
        </div>
      </div>
    </div>
  </template>

  <script src="/vendor/bootstrap.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
