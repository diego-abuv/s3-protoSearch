<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>S3 ProtoSearch — Admin</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav class="navbar-glass">
    <div class="user-menu">
      <button class="user-menu-toggle" id="userMenuToggle">
        <span class="user-avatar" id="userAvatar"></span>
        <span class="user-chevron">&#9662;</span>
      </button>
      <div class="user-dropdown" id="userDropdown">
        <div class="user-dropdown-info" id="userInfo"></div>
        <div class="user-dropdown-divider"></div>
        <button class="user-dropdown-item" id="btnBusca" style="color: inherit;">Busca</button>
        <div class="user-dropdown-divider"></div>
        <button class="user-dropdown-item" id="btnLogout">Sair</button>
      </div>
    </div>
  </nav>

  <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
    <span class="theme-icon-light">&#9788;</span>
    <span class="theme-icon-dark">&#9790;</span>
  </button>

  <main class="container py-4">

    <!-- Stats -->
    <section class="mb-4">
      <h2 class="fs-5 fw-bold gradient-text mb-3">Painel Admin</h2>
      <div class="row g-3" id="statsContainer">
        <div class="col-md-4">
          <div class="card glass-card border-0 text-center p-3">
            <div class="text-secondary small">Usuarios</div>
            <div class="fs-3 fw-bold gradient-text" id="statUsers">-</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card glass-card border-0 text-center p-3">
            <div class="text-secondary small">Logs de auditoria</div>
            <div class="fs-3 fw-bold gradient-text" id="statLogs">-</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card glass-card border-0 text-center p-3">
            <div class="text-secondary small">Sessoes ativas</div>
            <div class="fs-3 fw-bold gradient-text" id="statSessions">-</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Usuarios -->
    <section class="mb-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fs-5 fw-bold gradient-text mb-0">Usuarios</h2>
        <button class="btn btn-sm btn-gradient" id="btnNovoUsuario">+ Novo</button>
      </div>

      <!-- Form novo usuario (escondido) -->
      <div class="card glass-card border-0 mb-3 d-none" id="formNovoUsuario">
        <div class="card-body p-3">
          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small">Username</label>
              <input type="text" class="form-control form-control-sm glass-input" id="newUsername">
            </div>
            <div class="col-md-3">
              <label class="form-label small">Senha</label>
              <input type="password" class="form-control form-control-sm glass-input" id="newPassword">
            </div>
            <div class="col-md-2">
              <label class="form-label small">Role</label>
              <select class="form-select form-select-sm glass-input" id="newRole">
                <option value="user">user</option>
                <option value="admin">admin</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-sm btn-gradient w-100" id="btnSalvarNovo">Salvar</button>
            </div>
            <div class="col-md-2">
              <button class="btn btn-sm btn-outline-secondary w-100" id="btnCancelarNovo">Cancelar</button>
            </div>
          </div>
          <div id="novoUserError" class="text-danger small mt-2 d-none"></div>
        </div>
      </div>

      <!-- Tabela -->
      <div class="card glass-card border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-dark glass-table mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Username</th>
                  <th>Role</th>
                  <th class="text-end">Acoes</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr><td colspan="4" class="text-center text-secondary py-3">Carregando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- Auditoria -->
    <section class="mb-4">
      <h2 class="fs-5 fw-bold gradient-text mb-3">Auditoria</h2>
      <div class="card glass-card border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-dark glass-table mb-0">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Usuario</th>
                  <th>Acao</th>
                  <th>Detalhes</th>
                  <th>IP</th>
                </tr>
              </thead>
              <tbody id="auditTableBody">
                <tr><td colspan="5" class="text-center text-secondary py-3">Carregando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer border-0 text-center">
          <button class="btn btn-sm btn-outline-secondary" id="btnCarregarMais">Carregar mais</button>
        </div>
      </div>
    </section>

    <!-- Modal editar usuario -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card border-0">
          <div class="modal-header border-0">
            <h5 class="modal-title gradient-text">Editar usuario</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editUserId">
            <div class="mb-3">
              <label class="form-label small">Username</label>
              <input type="text" class="form-control form-control-sm glass-input" id="editUsername">
            </div>
            <div class="mb-3">
              <label class="form-label small">Role</label>
              <select class="form-select form-select-sm glass-input" id="editRole">
                <option value="user">user</option>
                <option value="admin">admin</option>
              </select>
            </div>
            <div id="editUserError" class="text-danger small d-none"></div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-sm btn-gradient" id="btnSalvarEdicao">Salvar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal confirmar exclusao -->
    <div class="modal fade" id="modalExcluir" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card border-0">
          <div class="modal-header border-0">
            <h5 class="modal-title text-danger">Confirmar exclusao</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="text-secondary">Tem certeza que deseja excluir o usuario <strong id="deleteUserName"></strong>?</p>
            <input type="hidden" id="deleteUserId">
            <div id="deleteUserError" class="text-danger small d-none"></div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-sm btn-danger" id="btnConfirmarExclusao">Excluir</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer class="text-center pt-4 pb-2">
    <span class="text-secondary small footer-credit">Desenvolvido por Diego Bueno</span>
  </footer>

  <script src="/vendor/bootstrap.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
